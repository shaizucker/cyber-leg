[env:teensy41]
platform = teensy@5.0.0
board = teensy41
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/tonton81/FlexCAN_T4#b928bcb2f74fdf0ccb76660f52ca1a2819ff4e2c
    https://github.com/joepasquariello/FlasherX#9d5067bf168cd8937201b1fc4b120836464a77fa
lib_ldf_mode = deep+
build_flags =
    -DUSB_SERIAL
    -DLAYOUT_US_ENGLISH
